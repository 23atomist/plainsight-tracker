; plainsight PTZ controller firmware for the BIGTREETECH SKR Pico v1.0 (RP2040).
;
; board_build.core = earlephilhower is required: without it PlatformIO silently
; builds against the Arduino Mbed core (no EEPROM.h, no Serial2, no setup1/loop1).

[env:skr_pico]
platform = raspberrypi
board = pico                  ; SKR Pico is a bare RP2040 + 2 MB QSPI flash, same as a Pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
build_flags =
    -Wall
    -Iinclude
