# Run `mkdir -p data` as the operator user (uid 1000) before the first
# `docker compose up`; otherwise Docker creates ./data as root.
services:
  head:
    build: .
    image: plainsight-head
    restart: unless-stopped
    init: true
    stop_grace_period: 5s
    ports:
      - "${HEAD_HOST_PORT:-8780}:8780"
    # The serial passthrough is static: the Pico must be plugged in at `docker compose up`,
    # and a re-enumeration to another ttyACM minor is not followed. Hot-plug (container up
    # without the Pico, unplug/replug, REBOOT) is verified on the rig in Task 12; see the
    # final-fix report (I6) for why a /dev/serial bind alone cannot provide it.
    # I2C does not re-enumerate, so its static entry is fine.
    devices:
      - "${HEAD_SERIAL_BY_ID}:/dev/ttyACM0"
      - "/dev/i2c-${HEAD_I2C_BUS}:/dev/i2c-${HEAD_I2C_BUS}"
    group_add:
      - "${DIALOUT_GID}"
      - "${I2C_GID}"
    volumes:
      - "./data:/data"
    env_file: .env
    logging:  # bounded on the SD card: at most 3 x 10 MB
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - HEAD_I2C_BUS=${HEAD_I2C_BUS}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8780/healthz', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
