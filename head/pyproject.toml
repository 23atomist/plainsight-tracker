[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plainsight-head"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10", "pyserial>=3.5"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "jsonschema"]

[project.scripts]
plainsight-head = "plainsight_head.main:main"

[tool.setuptools]
packages = ["plainsight_head"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
