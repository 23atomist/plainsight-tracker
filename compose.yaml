# Plainsight host stack. Run from this directory: `docker compose up -d --build`.
# All services use host networking: the config defaults assume 127.0.0.1 between
# processes and WebRTC ICE from a bridged container needs extra candidates.
# Profiles come from COMPOSE_PROFILES in .env (adsb,gps by default; vision is opt-in).
#
# DATA DIRECTORY OWNERSHIP: the Node services run as uid 1000 and mediamtx is
# pinned to 1000:1000. Create the tree before the first `up`, otherwise Docker
# creates the bind-mount dirs as root and state/snapshots/keep are unwritable:
#   sudo mkdir -p ${PLAINSIGHT_DATA}/{config,state,recordings,snapshots,adsb} \
#     && sudo chown -R 1000:1000 ${PLAINSIGHT_DATA}
#
# Time discipline (chrony/NTP sync from the GPS) is NOT containerised; it is a
# host-OS choice. The gpsd service below only exposes the receiver on :2947 (loopback; gpsd without -G).
x-host-service: &host-service
  build: ./host
  image: plainsight-host
  network_mode: host
  restart: unless-stopped
  init: true
  # required:false so `docker compose --env-file .env.example config` validates
  # without a real .env; at deploy time .env always exists.
  env_file:
    - path: .env
      required: false

services:
  mcp:
    <<: *host-service
    command: ["node", "dist/mcp/server.js"]
    volumes:
      - "${PLAINSIGHT_DATA}/config:/config:ro"
      - "${PLAINSIGHT_DATA}/state:/data/state"
      - "${PLAINSIGHT_DATA}/snapshots:/data/snapshots"
      # Read-write: keep-recording hardlinks /recordings/tb3/* into
      # /recordings/keep (src/shared/recordings/keep.ts), and a hardlink needs
      # a writable mount on the same filesystem. Delete is guarded to keep/.
      - "${PLAINSIGHT_DATA}/recordings:/recordings"
    # Container paths and the camera device, pinned here rather than left to
    # config.json: the code defaults are not these mount points, and a config
    # not derived from config.example.json would break recordings silently.
    environment:
      - TB3_CAPTURE_RECORDINGS_DIR=/recordings/tb3
      - TB3_CAPTURE_KEEP_DIR=/recordings/keep
      - TB3_CAMERA_V4L2_DEVICE=${CAMERA_DEVICE}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:${TB3_MCP_PORT:-8770}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  agent:
    <<: *host-service
    command: ["node", "dist/agent/agent.js"]
    volumes:
      - "${PLAINSIGHT_DATA}/config:/config:ro"
    depends_on:
      mcp:
        condition: service_healthy

  dashboard:
    <<: *host-service
    command: ["node", "dist/dashboard/server.js"]
    volumes:
      - "${PLAINSIGHT_DATA}/config:/config:ro"
      - "${PLAINSIGHT_DATA}/state:/data/state"
      - "${PLAINSIGHT_DATA}/snapshots:/data/snapshots"
      - "${PLAINSIGHT_DATA}/recordings:/recordings"
    # As for mcp: the mounts and the device passed through below.
    environment:
      - TB3_CAPTURE_RECORDINGS_DIR=/recordings/tb3
      - TB3_CAPTURE_KEEP_DIR=/recordings/keep
      - TB3_CAMERA_V4L2_DEVICE=${CAMERA_DEVICE}
    devices:
      - "${CAMERA_DEVICE}:${CAMERA_DEVICE}"
      - "/dev/dri/renderD128:/dev/dri/renderD128"
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    depends_on:
      - mcp
      - mediamtx

  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    # Operator uid so recordings are hardlinkable/deletable by the Node services.
    user: "1000:1000"
    network_mode: host
    restart: unless-stopped
    volumes:
      - "./host/mediamtx/mediamtx.yml:/mediamtx.yml:ro"
      - "${PLAINSIGHT_DATA}/recordings:/recordings"

  # Ported from /media/data/adsb/docker-compose.yml on 192.168.4.11. Reads the
  # Nooelec RTL-SDR (RTL2838, 0bda:2838) directly. readsb detaches the host
  # kernel's DVB driver itself at start-up ("Detached kernel driver" in the log);
  # blacklist dvb_usb_rtl28xxu only if it ever fails to claim (docs/DEPLOY.md).
  # 2026-11-05..13 it was fed Beast by a readsb-pluto sidecar (git history).
  adsb:
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:telegraf
    container_name: ultrafeeder
    hostname: ultrafeeder
    network_mode: host
    restart: unless-stopped
    device_cgroup_rules:
      - "c 189:* rwm"
    environment:
      - LOGLEVEL=${LOGLEVEL:-verbose}
      - TZ=${FEEDER_TZ}
      - READSB_DEVICE_TYPE=rtlsdr
      - READSB_RTLSDR_DEVICE=${RTLSDR_SERIAL:-}
      - READSB_GAIN=${RTLSDR_GAIN:-autogain}
      - READSB_RTLSDR_PPM=${RTLSDR_PPM:-0}
      # ON powers a bias-tee LNA from the dongle (needs a dongle with the circuit).
      - READSB_ENABLE_BIASTEE=${RTLSDR_BIASTEE:-OFF}
      - READSB_LAT=${FEEDER_LAT}
      - READSB_LON=${FEEDER_LONG}
      - READSB_ALT=${FEEDER_ALT_M}m
      - READSB_RX_LOCATION_ACCURACY=2
      - READSB_STATS_RANGE=true
      - ULTRAFEEDER_CONFIG=
        adsb,feed.adsb.fi,30004,beast_reduce_plus_out;
        adsb,in.adsb.lol,30004,beast_reduce_plus_out;
        adsb,feed.airplanes.live,30004,beast_reduce_plus_out;
        adsb,feed.planespotters.net,30004,beast_reduce_plus_out;
        adsb,data.avdelphi.com,24999,beast_reduce_plus_out;
        adsb,skyfeed.hpradar.com,30004,beast_reduce_plus_out;
        adsb,dati.flyitalyadsb.com,4905,beast_reduce_plus_out;
        mlat,feed.adsb.fi,31090,39000; mlat,in.adsb.lol,31090,39001;
        mlat,feed.airplanes.live,31090,39002;
        mlat,mlat.planespotters.net,31090,39003;
        mlat,skyfeed.hpradar.com,31090,39005;
        mlat,dati.flyitalyadsb.com,30100,39007;
      - UUID=${MULTIFEEDER_UUID}
      - MLAT_USER=${FEEDER_NAME}
      - UPDATE_TAR1090=true
      # Host networking: there is no 8088:80 port mapping as on .11, so nginx
      # must listen on 8088 itself (the image default is 80). adsbUrl and the
      # dashboard's services.adsb probe both expect :8088.
      - TAR1090_NGINX_PORT=8088
      - TAR1090_MESSAGERATEINTITLE=true
      - TAR1090_PAGETITLE=${FEEDER_NAME}
      - TAR1090_PLANECOUNTINTITLE=true
      - TAR1090_ENABLE_AC_DB=true
      - TAR1090_FLIGHTAWARELINKS=true
      - HEYWHATSTHAT_PANORAMA_ID=${FEEDER_HEYWHATSTHAT_ID}
      - HEYWHATSTHAT_ALTS=${FEEDER_HEYWHATSTHAT_ALTS}
      - TAR1090_SITESHOW=true
      - TAR1090_RANGE_OUTLINE_COLORED_BY_ALTITUDE=true
      - TAR1090_RANGE_OUTLINE_WIDTH=2.0
      - TAR1090_RANGERINGSDISTANCES=50,100,150,200
      - TAR1090_RANGERINGSCOLORS='#1A237E','#0D47A1','#42A5F5','#64B5F6'
      - TAR1090_USEROUTEAPI=true
      - GRAPHS1090_DARKMODE=true
      - INFLUXDBV2_URL=${INFLUX_URL:-}
      - INFLUXDBV2_TOKEN=${INFLUX_TOKEN:-}
      - INFLUXDBV2_BUCKET=${INFLUX_BUCKET:-adsb}
      - PROMETHEUS_ENABLE=false
    volumes:
      - "/dev/bus/usb:/dev/bus/usb"
      - "${PLAINSIGHT_DATA}/adsb/globe_history:/var/globe_history"
      - "${PLAINSIGHT_DATA}/adsb/graphs1090:/var/lib/collectd"
      - "/proc/diskstats:/proc/diskstats:ro"
    tmpfs:
      - /run:exec,size=256M
      - /tmp:size=128M
      - /var/log:size=32M
    profiles: ["adsb"]

  # u-blox GPS exposed on :2947 for the host (chrony etc. is a host-OS matter).
  gpsd:
    build: ./host/gpsd
    image: plainsight-gpsd
    network_mode: host
    restart: unless-stopped
    command: ["-N", "-n", "${GPS_DEVICE}"]
    devices:
      - "${GPS_DEVICE}:${GPS_DEVICE}"
    profiles: ["gps"]

  # Placeholder: the YOLO sidecar lives in the old repo at
  # TB3-ESP32/services/detector. Uncomment `build` once it is copied to
  # ./services/detector. Never started by default.
  detector:
    image: plainsight-detector
    # build: ./services/detector
    network_mode: host
    restart: unless-stopped
    profiles: ["vision"]
